[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:api_server]
command=uvicorn trends_and_insights_agent.api_server:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=
    PYTHONUNBUFFERED="1",
    PORT="8000"

[program:adk_server]
command=adk web --port 8001 trends_and_insights_agent
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25
environment=
    PYTHONUNBUFFERED="1"

[program:voice_server]
command=python voice_server.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
environment=
    PYTHONUNBUFFERED="1",
    VOICE_WS_PORT="8081",
    GOOGLE_CLOUD_LOCATION="us-central1"

[program:memory_api]
command=python memory_api.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=35
environment=
    PYTHONUNBUFFERED="1",
    MEMORY_API_PORT="8082",
    MEMORY_BANK_LOCATION="us-central1"