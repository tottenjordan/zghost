[pytest]
# Pytest configuration for zghost project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may be slower)
    slow: Slow tests (agent imports, full pipeline)

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=trends_and_insights_agent --cov-report=html --cov-report=term

# Asyncio mode (for async test support)
asyncio_mode = auto

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (optional - uncomment if pytest-timeout is installed)
# timeout = 300

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info dist build frontend node_modules
