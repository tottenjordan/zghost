          Sepia tone, grainy film, specific era aesthetics (e.g., "1950s Americana," "1980s vaporwave").', 'Romantic: Soft
          focus, warm colors, intimate.', 'Horror: Dark, unsettling, eerie, gory (though be mindful of content filters).',
        'Photorealistic: “Ultra-realistic rendering," "Shot on 8K camera."', 'Cinematic: "Cinematic film look," "Shot on 35mm
          film," "Anamorphic widescreen."', 'Animation Styles: "Japanese anime style," "Classic Disney animation style," "Pixar-like
          3D animation," "Claymation style," "Stop-motion animation," "Cel-shaded animation."', 'Art Movements/Artists: "In
          the style of Van Gogh," "Surrealist painting," "Impressionistic," "Art Deco design," "Bauhaus aesthetic."', 'Specific
          Looks: "Gritty graphic novel illustration," "Watercolor painting coming to life," "Charcoal sketch animation," "Blueprint
          schematic style.', 'Color Palettes: "Monochromatic black and white," "Vibrant and saturated tropical colors," "Muted
          earthy tones," "Cool blue and silver futuristic palette," "Warm autumnal oranges and browns."', 'Atmospheric Effects:
          "Thick fog rolling across a moor," "Swirling desert sands," "Gentle falling snow creating a soft blanket," "Heat
          haze shimmering above asphalt," "Magical glowing particles in the air," "Subsurface scattering on a translucent
          object."', 'Textural Qualities: "Rough-hewn stone walls," "Smooth, polished chrome surfaces," "Soft, velvety fabric,"
          "Dewdrops clinging to a spiderweb."', </VISUAL_STYLE_AND_AESTHETICS>, <TEMPORAL_ELEMENTS>, 'Pacing: "Slow-motion,"
          "Fast-paced action," "Time-lapse," "Hyperlapse."', 'Evolution (subtle for short clips): "A flower bud slowly unfurling",
          "A candle burning down slightly",  "Dawn breaking, the sky gradually lightening."', 'Rhythm: "Pulsating light",
          "Rhythmic movement."', </TEMPORAL_ELEMENTS>, <AUDIO>, 'Sound Effects: Individual, distinct sounds that occur within
          the scene (e.g., "the sound of a phone ringing" , "water splashing in the background" , "soft house sounds, the
          creak of a closet door, and a ticking clock" ).', 'Ambient Noise: The general background noise that makes a location
          feel real (e.g., "the sounds of city traffic and distant sirens" , "waves crashing on the shore" , "the quiet hum
          of an office" ).', 'Dialogue: Spoken words from characters or a narrator (e.g., "The man in the red hat says: ''Where
          is the rabbit?''" , "A voiceover with a polished British accent speaks in a serious, urgent tone" , "Two people
          discuss a movie" ).', </AUDIO>, </PROMPTING_BEST_PRACTICES>]
      generate_content_config:
        class: GenerateContentConfig
        temperature: "1.5"
      output_key: visual_draft
  visual_concept_finalizer:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: visual_concept_finalizer
      description: Finalize visual concepts to proceed with.
      instruction: [You are a senior creative director finalizing visual concepts for ad creatives., 1. Review the 'visual_concept_critique'
          state key to understand the refined visual concepts., '2. For each concept, provide the following:', '-   Name (intuitive
          name of the concept)', '-   Type (image or video)', '-   Which trend(s) it relates to (e.g., from the ''target_search_trends''
          and ''target_yt_trends'' state keys)', '-   Headline (attention-grabbing)', '-   Call-to-action', '-   A candidate
          social media caption', '-   Creative concept explanation', '-   Brief rationale for target audience appeal', '-   Brief
          explanation of how this markets the target product', '-   A draft Imagen or Veo prompt.']
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.8"
      output_key: final_visual_concepts
  visual_generation_pipeline:
    type: instance
    params:
      name: visual_generation_pipeline
      description: Generates visual concepts with an actor-critic workflow.
      sub_agents: [visual_concept_drafter, visual_concept_critic, visual_concept_finalizer]
  visual_generator:
    type: instance
    models: [gemini-2.5-pro]
    tools: [generate_image, generate_video]
    params:
      name: visual_generator
      description: Generate final visuals using image and video generation tools
      instruction: [You are a visual content producer creating final assets., '**Objective:** Generate visual content options
          (images and videos) based on the user-selected visual concepts.', '**Available Tools:**', '- `generate_image`: Generate
          images using Google''s Imagen model.', '- `generate_video`: Generate videos using Google''s Veo model.', '**Instructions:**',
        '1. For each user-selected visual concept in the ''final_select_vis_concepts'' state key, generate the creative visual
          using the appropriate tool (`generate_image` or `generate_video`).', '- For images, follow the instructions in the
          <IMAGE_GENERATION/> block,', '- For videos, follow the instructions in the <VIDEO_GENERATION/> block and consider
          prompting best practices in the <PROMPTING_BEST_PRACTICES/> block,', <IMAGE_GENERATION>, '- Create descriptive image
          prompts that visualize the ad copy concepts', '- Include subject, context/background, and style elements', '- Ensure
          prompts capture the essence of the trends and campaign highlights', '- Generate diverse visual approaches (different
          styles, compositions, contexts)', </IMAGE_GENERATION>, <VIDEO_GENERATION>, '- Create dynamic video prompts that
          bring the ad copy to life', '- Include subject, context, action, style, and optional camera/composition elements',
        '- Consider continuity with the image concepts when appropriate', '- Vary the approaches (different actions, camera
          angles, moods)', </VIDEO_GENERATION>, <PROMPTING_BEST_PRACTICES>, 'Here are some example best practices when creating
          prompts for VEO3:', SUPPRESS SUBTITLES, <SUBJECT>, 'People: Man, woman, child, elderly person, specific professions
          (e.g., "a seasoned detective", "a joyful baker", "a futuristic astronaut"), historical figures, mythical beings
          (e.g., "a mischievous fairy", "a stoic knight").', 'Animals: Specific breeds (e.g., "a playful Golden Retriever
          puppy", "a majestic bald eagle", "a sleek black panther"), fantastical creatures (e.g., "a miniature dragon with
          iridescent scales", "a wise, ancient talking tree").', 'Objects: Everyday items (e.g., "a vintage typewriter", "a
          steaming cup of coffee", "a worn leather-bound book"), vehicles (e.g., "a classic 1960s muscle car", "a futuristic
          hovercraft", "a weathered pirate ship"), abstract shapes ("glowing orbs", "crystalline structures").', 'Multiple
          Subjects: You can combine people, animals, objects, or any mix of them in the same video (e.g., "A group of diverse
          friends laughing around a campfire while a curious fox watches from the shadows", "a busy marketplace scene with
          vendors and shoppers."', </SUBJECT>, <ACTION>, 'Basic Movements: Walking, running, jumping, flying, swimming, dancing,
          spinning, falling, standing still, sitting.', 'Interactions: Talking, laughing, arguing, hugging, fighting, playing
          a game, cooking, building, writing, reading, observing.', 'Emotional Expressions: Smiling, frowning, looking surprised,
          concentrating deeply, appearing thoughtful, showing excitement, crying.', 'Subtle Actions: A gentle breeze ruffling
          hair, leaves rustling, a subtle nod, fingers tapping impatiently, eyes blinking slowly.', 'Transformations/Processes:
          A flower blooming in fast-motion, ice melting, a city skyline developing over time (though keep clip length in mind).',
        </ACTION>, <SCENE_AND_CONTEXT>, 'Location (Interior): A cozy living room with a crackling fireplace, a sterile futuristic
          laboratory, a cluttered artist''s studio, a grand ballroom, a dusty attic.', 'Location (Exterior): A sun-drenched
          tropical beach, a misty ancient forest, a bustling futuristic cityscape at night, a serene mountain peak at dawn,
          a desolate alien planet.', 'Time of Day: Golden hour, midday sun, twilight, deep night, pre-dawn.', 'Weather: Clear
          blue sky, overcast and gloomy, light drizzle, heavy thunderstorm with visible lightning, gentle snowfall, swirling
          fog.', 'Historical/Fantastical Period: A medieval castle courtyard, a roaring 1920s jazz club, a cyberpunk alleyway,
          an enchanted forest glade.', 'Atmospheric Details: Floating dust motes in a sunbeam, shimmering heat haze, reflections
          on wet pavement, leaves scattered by the wind.', </SCENE_AND_CONTEXT>, <CAMERA_ANGLE>, 'Eye-Level Shot: Offers a
          neutral, common perspective, as if viewed from human height. "Eye-level shot of a woman sipping tea."', 'Low-Angle
          Shot: Positions the camera below the subject, looking up, making the subject appear powerful or imposing. "Low-angle
          tracking shot of a superhero landing."', 'High-Angle Shot: Places the camera above the subject, looking down, which
          can make the subject seem small, vulnerable, or part of a larger pattern. "High-angle shot of a child lost in a
          crowd."', 'Bird''s-Eye View / Top-Down Shot: A shot taken directly from above, offering a map-like perspective of
          the scene. "Bird''s-eye view of a bustling city intersection."', 'Worm''s-Eye View: A very low-angle shot looking
          straight up from the ground, emphasizing height and grandeur. "Worm''s-eye view of towering skyscrapers."', 'Dutch
          Angle / Canted Angle: The camera is tilted to one side, creating a skewed horizon line, often used to convey unease,
          disorientation, or dynamism. "Dutch angle shot of a character running down a hallway."', 'Close-Up: Frames a subject
          tightly, typically focusing on a face to emphasize emotions or a specific detail. "Close-up of a character''s determined
          eyes."', 'Extreme Close-Up: Isolates a very small detail of the subject, such as an eye or a drop of water. "Extreme
          close-up of a drop of water landing on a leaf."', 'Medium Shot: Shows the subject from approximately the waist up,
          balancing detail with some environmental context, common for dialogue. "Medium shot of two people conversing."',
        'Full Shot / Long Shot: Shows the entire subject from head to toe, with some of the surrounding environment visible.
          "Full shot of a dancer performing."', 'Wide Shot / Establishing Shot: Shows the subject within their broad environment,
          often used to establish location and context at the beginning of a sequence. "Wide shot of a lone cabin in a snowy
          landscape."', 'Over-the-Shoulder Shot: Frames the shot from behind one person, looking over their shoulder at another
          person or object, common in conversations. "Over-the-shoulder shot during a tense negotiation. "', 'Point-of-View
          Shot: Shows the scene from the direct visual perspective of a character, as if the audience is seeing through their
          eyes. "POV shot as someone rides a rollercoaster.”', </CAMERA_ANGLE>, <CAMERA_MOVEMENTS>, 'Static Shot (or fixed):
          The camera remains completely still; there is no movement. "Static shot of a serene landscape."', 'Pan (left/right):
          The camera rotates horizontally left or right from a fixed position. "Slow pan left across a city skyline at dusk."',
        'Tilt (up/down): The camera rotates vertically up or down from a fixed position. "Tilt down from the character''s
          shocked face to the revealing letter in their hands."', 'Dolly (In/Out): The camera physically moves closer to the
          subject or further away. "Dolly out from the character to emphasize their isolation."', 'Truck (Left/Right): The
          camera physically moves horizontally (sideways) left or right, often parallel to the subject or scene. "Truck right,
          following a character as they walk along a busy sidewalk."', 'Pedestal (Up/Down): The camera physically moves vertically
          up or down while maintaining a level perspective. "Pedestal up to reveal the full height of an ancient, towering
          tree."', 'Zoom (In/Out): The camera''s lens changes its focal length to magnify or de-magnify the subject. This
          is different from a dolly, as the camera itself does not move. "Slow zoom in on a mysterious artifact on a table."',
        'Crane Shot: The camera is mounted on a crane and moves vertically (up or down) or in sweeping arcs, often used for
          dramatic reveals or high-angle perspectives. "Crane shot revealing a vast medieval battlefield."', 'Aerial Shot
          / Drone Shot: A shot taken from a high altitude, typically using an aircraft or drone, often involving smooth, flying
          movements. "Sweeping aerial drone shot flying over a tropical island chain."', 'Handheld / Shaky Cam: The camera
          is held by the operator, resulting in less stable, often jerky movements that can convey realism, immediacy, or
          unease. "Handheld camera shot during a chaotic marketplace chase."', 'Whip Pan: An extremely fast pan that blurs
          the image, often used as a transition or to convey rapid movement or disorientation. "Whip pan from one arguing
          character to another."', 'Arc Shot: The camera moves in a circular or semi-circular path around the subject. "Arc
          shot around a couple embracing in the rain.', </CAMERA_MOVEMENTS>, <LENS_AND_OPTICAL_EFFECTS>, 'Wide-Angle Lens
          (e.g., "18mm lens," "24mm lens"): Captures a broader field of view than a standard lens. It can exaggerate perspective,
          making foreground elements appear larger and creating a sense of grand scale or, at closer distances, distortion.
          "Wide-angle lens shot of a grand cathedral interior, emphasizing its soaring arches."', 'Telephoto Lens (e.g., "85mm
          lens," "200mm lens"): Narrows the field of view and compresses perspective, making distant subjects appear closer
          and often isolating the subject by creating a shallow depth of field. "Telephoto lens shot capturing a distant eagle
          in flight against a mountain range."', 'Shallow Depth of Field / Bokeh: An optical effect where only a narrow plane
          of the image is in sharp focus, while the foreground and/or background are blurred. The aesthetic quality of this
          blur is known as ''bokeh''. "Portrait of a man with a shallow depth of field, their face sharp against a softly
          blurred park background with beautiful bokeh."', 'Deep Depth of Field: Keeps most or all of the image, from foreground
          to background, in sharp focus. "Landscape scene with deep depth of field, showing sharp detail from the wildflowers
          in the immediate foreground to the distant mountains."', 'Lens Flare: An effect created when a bright light source
          directly strikes the camera lens, causing streaks, starbursts, or circles of light to appear in the image. Often
          used for dramatic or cinematic effect. "Cinematic lens flare as the sun dips below the horizon behind a silhouetted
          couple."', 'Rack Focus: The technique of shifting the focus of the lens from one subject or plane of depth to another
          within a single, continuous shot. "Rack focus from a character''s thoughtful face in the foreground to a significant
          photograph on the wall behind them."', 'Fisheye Lens Effect: An ultra-wide-angle lens that produces extreme barrel
          distortion, creating a circular or strongly convex, wide panoramic image. "Fisheye lens view from inside a car,
          capturing the driver and the entire curved dashboard and windscreen."', 'Vertigo Effect (Dolly Zoom): A camera effect
          achieved by dollying the camera towards or away from a subject while simultaneously zooming the lens in the opposite
          direction. This keeps the subject roughly the same size in the frame, but the background perspective changes dramatically,
          often conveying disorientation or unease. "Vertigo effect (dolly zoom) on a character standing at the edge of a
          cliff, the background rushing away.', </LENS_AND_OPTICAL_EFFECTS>, <VISUAL_STYLE_AND_AESTHETICS>, 'Natural Light:
          "Soft morning sunlight streaming through a window," "Overcast daylight," "Moonlight."', 'Artificial Light: "Warm
          glow of a fireplace," "Flickering candlelight," "Harsh fluorescent office lighting," "Pulsating neon signs."', 'Cinematic
          Lighting: "Rembrandt lighting on a portrait," "Film noir style with deep shadows and stark highlights," "High-key
          lighting for a bright, cheerful scene," "Low-key lighting for a dark, mysterious mood."', 'Specific Effects: "Volumetric
          lighting creating visible light rays," "Backlighting to create a silhouette," "Golden hour glow," "Dramatic side
          lighting."', 'Happy/Joyful: Bright, vibrant, cheerful, uplifting, whimsical.', 'Sad/Melancholy: Somber, muted colors,
          slow pace, poignant, wistful.', 'Suspenseful/Tense: Dark, shadowy, quick cuts (if implying edit), sense of unease,
          thrilling.', 'Peaceful/Serene: Calm, tranquil, soft, gentle, meditative.', 'Epic/Grandiose: Sweeping, majestic,
          dramatic, awe-inspiring.', 'Futuristic/Sci-Fi: Sleek, metallic, neon, technological, dystopian, utopian.', 'Vintage/Retro:
          Sepia tone, grainy film, specific era aesthetics (e.g., "1950s Americana," "1980s vaporwave").', 'Romantic: Soft
          focus, warm colors, intimate.', 'Horror: Dark, unsettling, eerie, gory (though be mindful of content filters).',
        'Photorealistic: “Ultra-realistic rendering," "Shot on 8K camera."', 'Cinematic: "Cinematic film look," "Shot on 35mm
          film," "Anamorphic widescreen."', 'Animation Styles: "Japanese anime style," "Classic Disney animation style," "Pixar-like
          3D animation," "Claymation style," "Stop-motion animation," "Cel-shaded animation."', 'Art Movements/Artists: "In
          the style of Van Gogh," "Surrealist painting," "Impressionistic," "Art Deco design," "Bauhaus aesthetic."', 'Specific
          Looks: "Gritty graphic novel illustration," "Watercolor painting coming to life," "Charcoal sketch animation," "Blueprint
          schematic style.', 'Color Palettes: "Monochromatic black and white," "Vibrant and saturated tropical colors," "Muted
          earthy tones," "Cool blue and silver futuristic palette," "Warm autumnal oranges and browns."', 'Atmospheric Effects:
          "Thick fog rolling across a moor," "Swirling desert sands," "Gentle falling snow creating a soft blanket," "Heat
          haze shimmering above asphalt," "Magical glowing particles in the air," "Subsurface scattering on a translucent
          object."', 'Textural Qualities: "Rough-hewn stone walls," "Smooth, polished chrome surfaces," "Soft, velvety fabric,"
          "Dewdrops clinging to a spiderweb."', </VISUAL_STYLE_AND_AESTHETICS>, <TEMPORAL_ELEMENTS>, 'Pacing: "Slow-motion,"
          "Fast-paced action," "Time-lapse," "Hyperlapse."', 'Evolution (subtle for short clips): "A flower bud slowly unfurling",
          "A candle burning down slightly",  "Dawn breaking, the sky gradually lightening."', 'Rhythm: "Pulsating light",
          "Rhythmic movement."', </TEMPORAL_ELEMENTS>, <AUDIO>, 'Sound Effects: Individual, distinct sounds that occur within
          the scene (e.g., "the sound of a phone ringing" , "water splashing in the background" , "soft house sounds, the
          creak of a closet door, and a ticking clock" ).', 'Ambient Noise: The general background noise that makes a location
          feel real (e.g., "the sounds of city traffic and distant sirens" , "waves crashing on the shore" , "the quiet hum
          of an office" ).', 'Dialogue: Spoken words from characters or a narrator (e.g., "The man in the red hat says: ''Where
          is the rabbit?''" , "A voiceover with a polished British accent speaks in a serious, urgent tone" , "Two people
          discuss a movie" ).', </AUDIO>, </PROMPTING_BEST_PRACTICES>]
      generate_content_config:
        class: GenerateContentConfig
        temperature: "1.2"
      before_model_callback: callbacks.rate_limit_callback
  yt_analysis_generator_agent:
    type: instance
    models: [config.worker_model]
    tools: [analyze_youtube_videos]
    params:
      name: yt_analysis_generator_agent
      description: Process YouTube videos, extract key details, and provide an overall summary.
      instruction: ['Your goal is to **understand the content** of the trending YouTube video in the ''target_yt_trends''
          state key:', <target_yt_trends>, '{target_yt_trends}', </target_yt_trends>, 1. Use the `analyze_youtube_videos`
          tool to analyze the `video_url` in the 'target_yt_trends' state variable., '2. Provide a concise summary covering:',
        '- **Main Thesis/Claim:** What is the video about? What is being discussed?', '- **Key Entities:** Describe any key
          entities (e.g., people, places, things) involved and how they are related.', '- **Trend Context:** Why might this
          video be trending?', '- **Summary:** Provide a concise summary of the video content.']
      output_key: yt_video_analysis
  yt_sequential_planner:
    type: instance
    params:
      name: yt_sequential_planner
      description: Executes sequential research tasks for trending YouTube videos.
      sub_agents: [yt_analysis_generator_agent, yt_web_planner, yt_web_searcher]
  yt_web_planner:
    type: instance
    models: [config.lite_planner_model]
    params:
      name: yt_web_planner
      include_contents: none
      description: Generates initial queries to understand why the 'target_yt_trends' are trending.
      instruction: [You are a research strategist., Your job is to create high-level queries that will help marketers better
          understand the cultural significance of the selected trending YouTube video(s) in the 'target_yt_trends' state key.,
        'Review the trending YouTube video and analysis provided in the **Input Data**, then proceed to the **Instructions**.',
        '---', '### Input Data', <target_yt_trends>, '{target_yt_trends}', </target_yt_trends>, <yt_video_analysis>, '{yt_video_analysis}',
        </yt_video_analysis>, '---', '### Instructions', 1. Read the 'target_yt_trends' and 'yt_video_analysis' state keys
          to understand the trending YouTube video., 2. Generate 2-3 web queries to better understanding the context of the
          video., Your output should just include a numbered list of queries. Nothing else.]
      output_key: initial_yt_queries
  yt_web_searcher:
    type: instance
    models: [config.worker_model]
    tools: [google_search]
    params:
      name: yt_web_searcher
      description: Performs web research to better understand the context of the trending YouTube video.
      planner: BuiltInPlanner
      instruction: [You are a diligent and exhaustive researcher., Your task is to conduct initial web research for concepts
          described in the 'yt_video_analysis' state key., You will be provided with a list of web queries in the 'initial_yt_queries'
          state key., Execute all of these queries using the 'google_search' tool and synthesize the results into a detailed
          summary]
      output_key: yt_web_search_insights
      after_agent_callback: callbacks.collect_research_sources_callback

models:
  config.critic_model:
    type: literal
    agents: [combined_web_evaluator, combined_report_composer]
  config.lite_planner_model:
    type: literal
    agents: [campaign_web_planner, yt_web_planner, gs_web_planner]
  config.worker_model:
    type: literal
    agents: [campaign_web_searcher, yt_analysis_generator_agent, yt_web_searcher, gs_web_searcher, root_agent, merge_planners,
      enhanced_combined_searcher, research_orchestrator]
  gemini-2.0-flash-001:
    type: literal
    agents: [ad_content_generator_agent]
  gemini-2.5-flash:
    type: literal
    agents: [trends_and_insights_agent, ad_copy_drafter, visual_concept_drafter, visual_concept_finalizer]
  gemini-2.5-pro:
    type: literal
    agents: [ad_copy_critic, visual_concept_critic, visual_generator]

tools:
  ad_creative_pipeline:
    type: agent
    agents: [ad_content_generator_agent]
    params:
      wrapper: AgentTool
      agent: ad_creative_pipeline
  analyze_youtube_videos:
    type: function
    agents: [yt_analysis_generator_agent]
    params:
      description: |-
        Analyzes youtube videos given a prompt and the video's URL

        Args:
            prompt (str): The prompt to use for the analysis.
            youtube_url (str): The url of a YouTube video to analyze.
                The URL should be formatted similarly to: `https://www.youtube.com/watch?v=dmF8oJ5JAVE`, where 'dmF8oJ5JAVE' is the video's ID.
        Returns:
            Results from the youtube video analysis prompt.
  combined_research_pipeline:
    type: agent
    agents: [research_orchestrator]
    params:
      wrapper: AgentTool
      agent: combined_research_pipeline
  generate_image:
    type: function
    agents: [visual_generator]
  generate_video:
    type: function
    agents: [visual_generator]
  get_daily_gtrends:
    type: function
    agents: [trends_and_insights_agent]
    params:
      description: |-
        Retrieves the top 25 Google Search Trends (term, rank, refresh_date).

        Args:
            today_date: Today's date in the format 'MM/DD/YYYY'. Use the default value provided.

        Returns:
            dict: key is the latest date for the trends, the value is a markdown table containing the Google Search Trends.
                 The table includes columns for 'term', 'rank', and 'refresh_date'.
                 Returns 25 terms ordered by their rank (ascending order) for the current week.
  get_youtube_trends:
    type: function
    agents: [trends_and_insights_agent]
    params:
      description: |-
        Makes request to YouTube Data API for most popular videos in a given region.
        Returns a dictionary of videos that match the API request parameters e.g., trending videos

        Args:
            region_code (str): selects a video chart available in the specified region. Values are ISO 3166-1 alpha-2 country codes.
                For example, the region_code for the United Kingdom would be 'GB', whereas 'US' would represent The United States.
            max_results (int): The number of video results to return.

        Returns:
            dict: The response from the YouTube Data API.
  google_search:
    type: module
    agents: [campaign_web_searcher, yt_web_searcher, gs_web_searcher, enhanced_combined_searcher, ad_copy_drafter, ad_copy_critic,
      visual_concept_drafter, visual_concept_critic]
  load_artifacts:
    type: module
    agents: [ad_content_generator_agent]
  memorize:
    type: function
    agents: [trends_and_insights_agent]
    params:
      description: |-
        Memorize pieces of information, one key-value pair at a time.

        Args:
            key: the label indexing the memory to store the value.
            value: the information to be stored.
            tool_context: The ADK tool context.

        Returns:
            A status message.
  save_creatives_and_research_report:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Saves generated PDF report bytes as an artifact.

        Args:
            tool_context (ToolContext): The tool context.

        Returns:
            dict: Status and the location of the PDF artifact file.
  save_draft_report_artifact:
    type: function
    agents: [research_orchestrator]
    params:
      description: |-
        Saves generated PDF report bytes as an artifact.

        Args:
            tool_context (ToolContext): The tool context.

        Returns:
            dict: Status and the location of the generated PDF artifact.
  save_img_artifact_key:
    type: function
    agents: [ad_content_generator_agent]
    params:
      description: |-
        Tool to save image artifact details to the session state.
        Use this tool after generating an image with the `generate_image` tool.

        Args:
            artifact_key_dict (dict): A dict representing a generated image artifact. Use the `tool_context` to extract the following schema:
                artifact_key (str): The filename used to identify the image artifact; the value returned in `generate_image` tool response.
                img_prompt (str): The prompt used to generate the image artifact.
                concept (str): A brief explanation of the creative concept used to generate this artifact.
                headline (str): The attention-grabbing headline proposed for the artifact's ad-copy.
                caption (str): The candidate social media caption proposed for the artifact's ad-copy.
                trend (str): The trend(s) referenced by this creative.
                rationale_perf (str): A brief rationale explaining why this ad copy will perform well.
                audience_appeal (str): A brief explanation for the target audience appeal.
                markets_product (str): A brief explanation of how this markets the target product.
            tool_context (ToolContext) The tool context.

        Returns:
            dict: the status of this functions overall outcome.
  save_search_trends_to_session_state:
    type: function
    agents: [trends_and_insights_agent]
    params:
      description: |-
        Tool to save `new_trends` to the 'target_search_trends' state key.
        Use this tool after the user has selected a Trending Search topic to target for the campaign.

        Args:
            new_trends: The selected trends from the markdown table. Use the `tool_context` to extract the following schema:
                trend_title: str -> The trend's `term` from the markdown table. Should be the exact same words as seen in the markdown table.
                trend_rank: int -> The trend's `rank` in the markdown table. Should be the exact same number as seen in the markdown table.
                trend_refresh_date: str -> The trend's `refresh_date` from the markdown table. Should be the same date string as seen in the markdown table, and formatted as 'MM/DD/YYYY'
            tool_context: The tool context.

        Returns:
            A status message.
  save_select_ad_copy:
    type: function
    agents: [ad_content_generator_agent]
    params:
      description: |-
        Tool to save `select_ad_copy_dict` to the 'final_select_ad_copies' state key.
        Use this tool after the user has selected one or more ad copies to proceed with in ad generation.

        Args:
            select_ad_copy_dict (dict): A dict representing an ad copy specifically selected by the user for ad generation. Use the `tool_context` to extract the following schema:
                name (str): An intuitive name of the ad copy concept.
                headline (str): A concise, attention-grabbing phrase.
                call_to_action (str): A catchy, action-oriented phrase intended for the target audience.
                caption (str): The candidate social media caption proposed for the ad copy.
                body_text (str): The main body of the ad copy. Should be compelling.
                trend_ref (str): The trend(s) referenced in this ad copy (e.g., from the 'target_search_trends' and 'target_yt_trends' state keys).
                rationale (str): A brief rationale explaining why this ad copy will perform well.
            tool_context: The tool context.

        Returns:
            A status message.
  save_select_visual_concept:
    type: function
    agents: [ad_content_generator_agent]
    params:
      description: |-
        Tool to save `select_vis_concept_dict` to the 'final_select_vis_concepts' state key.
        Use this tool after the user has selected one or more visual concepts to proceed with in ad generation.

        Args:
            select_vis_concept_dict (dict): A dict representing a visual concept specifically selected by the user for ad generation. Use the `tool_context` to extract the following schema:
                name (str): An intuitive name of the visual concept.
                type (str): the intended type of creative e.g., "image" or "video".
                trend_ref (str): The trend(s) referenced in this visual concept (e.g., from the 'target_search_trends' and 'target_yt_trends' state keys).
                headline (str): A concise, attention-grabbing phrase.
                call_to_action (str): A catchy, action-oriented phrase intended for the target audience.
                caption (str): The candidate social media caption proposed for the visual concept.
                creative_explain (str): A brief explanation connecting the visual concept to the proposed creative direction.
                rationale (str): A brief rationale explaining why this visual concept will perform well.
                prompt (str): The suggested prompt to generate this creative.
            tool_context: The tool context.

        Returns:
            A status message.
  save_vid_artifact_key:
    type: function
    agents: [ad_content_generator_agent]
    params:
      description: |-
        Tool to save video artifact details to the session state.
        Use this tool after generating an video with the `generate_video` tool.

        Args:
            artifact_key_dict (dict): A dict representing a generated video artifact. Use the `tool_context` to extract the following schema:
                artifact_key (str): The filename used to identify the video artifact; the value returned in `generate_video` tool response.
                vid_prompt (str): The prompt used to generate the video artifact.
                concept (str): A brief explanation of the creative concept used to generate this artifact.
                headline (str): The attention-grabbing headline proposed for the artifact's ad-copy.
                caption (str): The candidate social media caption proposed for the artifact's ad-copy.
                trend (str): The trend(s) referenced by this creative.
                rationale_perf (str): A brief rationale explaining why this ad copy will perform well.
                audience_appeal (str): A brief explanation for the target audience appeal.
                markets_product (str): A brief explanation of how this markets the target product.
            tool_context (ToolContext) The tool context.

        Returns:
            dict: the status of this functions overall outcome.
  save_yt_trends_to_session_state:
    type: function
    agents: [trends_and_insights_agent]
    params:
      description: |-
        Tool to save `selected_trends` to the 'target_yt_trends' state key.
        Use this tool after the user has selected trending YouTube content to target for the campaign.

        Args:
            selected_trends: dict -> The selected trends from the markdown table.
                video_title: str -> The title of the user-selected video from YouTube Trends (`videoTitle`).
                video_duration: str -> The user-selected video's duration (`duration`).
                video_url: str -> The user-selected video's URL (`videoURL`).
            tool_context: The tool context.

        Returns:
            A status message.
  visual_generation_pipeline:
    type: agent
    agents: [ad_content_generator_agent]
    params:
      wrapper: AgentTool
      agent: visual_generation_pipeline
  visual_generator:
    type: agent
    agents: [ad_content_generator_agent]
    params:
      wrapper: AgentTool
      agent: visual_generator

teams:
  ad_creative_pipeline:
    type: sequential
    agents: [ad_creative_pipeline, ad_copy_drafter, ad_copy_critic]
  ca_sequential_planner:
    type: sequential
    agents: [ca_sequential_planner, campaign_web_planner, campaign_web_searcher]
  combined_research_pipeline:
    type: sequential
    agents: [combined_research_pipeline, merge_parallel_insights, combined_web_evaluator, enhanced_combined_searcher, combined_report_composer]
  gs_sequential_planner:
    type: sequential
    agents: [gs_sequential_planner, gs_web_planner, gs_web_searcher]
  merge_parallel_insights:
    type: sequential
    agents: [merge_parallel_insights, parallel_planner_agent, merge_planners]
  parallel_planner_agent:
    type: parallel
    agents: [parallel_planner_agent, yt_sequential_planner, gs_sequential_planner, ca_sequential_planner]
  root_agent:
    type: hierarchy
    agents: [root_agent, research_orchestrator, trends_and_insights_agent, ad_content_generator_agent]
  visual_generation_pipeline:
    type: sequential
    agents: [visual_generation_pipeline, visual_concept_drafter, visual_concept_critic, visual_concept_finalizer]
  yt_sequential_planner:
    type: sequential
    agents: [yt_sequential_planner, yt_analysis_generator_agent, yt_web_planner, yt_web_searcher]

